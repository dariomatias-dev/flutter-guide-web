name: Bug report
description: Something on the site is broken or behaves incorrectly.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected instead.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://flutter-guide-web.vercel.app/...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: Chrome 130 on Android 15
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or console errors
